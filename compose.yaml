name: metrics-pipeline

x-app: &app
  image: metrics-pipeline:local
  restart: unless-stopped
  stop_grace_period: 20s
  networks:
    - pipeline
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

x-app-environment: &app-environment
  DATABASE_URL: postgres://${POSTGRES_USER:-metrics}:${POSTGRES_PASSWORD:-metrics}@postgres:5432/${POSTGRES_DB:-metrics}?sslmode=disable
  AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER:-metrics}:${RABBITMQ_DEFAULT_PASS:-metrics}@rabbitmq:5672/
  AMQP_PUBLISHERS: "${AMQP_PUBLISHERS:-1}"
  AMQP_WRITE_TIMEOUT: ${AMQP_WRITE_TIMEOUT:-5s}
  AMQP_CONFIRM_TIMEOUT: ${AMQP_CONFIRM_TIMEOUT:-5s}
  AMQP_PUBLISH_MAX_ATTEMPTS: "${AMQP_PUBLISH_MAX_ATTEMPTS:-3}"
  AMQP_PUBLISH_INITIAL_BACKOFF: ${AMQP_PUBLISH_INITIAL_BACKOFF:-100ms}
  AMQP_PUBLISH_MAX_BACKOFF: ${AMQP_PUBLISH_MAX_BACKOFF:-1s}
  RETENTION_WINDOW: ${RETENTION_WINDOW:-168h}
  PARTITION_MAINTENANCE_INTERVAL: ${PARTITION_MAINTENANCE_INTERVAL:-1h}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-15s}

services:
  postgres:
    image: postgres:16-alpine
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metrics}
      POSTGRES_USER: ${POSTGRES_USER:-metrics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metrics}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pipeline
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    stop_grace_period: 30s
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-metrics}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-metrics}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - pipeline
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    image: metrics-pipeline:local
    command: ["/app/migrate"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-metrics}:${POSTGRES_PASSWORD:-metrics}@postgres:5432/${POSTGRES_DB:-metrics}?sslmode=disable
      MIGRATIONS_DIR: /migrations
      MIGRATION_TIMEOUT: ${MIGRATION_TIMEOUT:-60s}
      PARTITION_PAST_DAYS: ${PARTITION_PAST_DAYS:-8}
      PARTITION_FUTURE_DAYS: ${PARTITION_FUTURE_DAYS:-2}
    networks:
      - pipeline
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["/app/api"]
    environment:
      <<: *app-environment
      SERVICE_NAME: api
      INSTANCE_ID: api-local-1
      HTTP_ADDR: :8080
      ADMIN_ADDR: :8081
    ports:
      - "${API_PORT:-8080}:8080"
      - "${API_ADMIN_PORT:-8081}:8081"

  worker:
    <<: *app
    command: ["/app/worker"]
    environment:
      <<: *app-environment
      SERVICE_NAME: worker
      INSTANCE_ID: worker-local-1
      HTTP_ADDR: :8090
      ADMIN_ADDR: :8091

networks:
  pipeline:
    name: metrics-pipeline-network
    driver: bridge

volumes:
  postgres-data:
    name: metrics-pipeline-postgres-data
  rabbitmq-data:
    name: metrics-pipeline-rabbitmq-data
